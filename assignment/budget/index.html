<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="icon" type="image/png" href="../../logos.png">
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="./script.js"></script>
    <script defer src="./ai-assistant.js"></script>
</head>
<body>

<div class="page">

    <div class="top-row">
        <div class="card">
            <h2 class="card-title">Budget</h2>
            <input
                type="number"
                id="budgetInput"
                class="text-input"
                placeholder="Enter Total Amount"
                min="1"
                inputmode="decimal"
                onkeydown="if(event.key==='Enter'){event.preventDefault();setBudget();}"
            >
            <button type="button" class="btn-blue" onclick="setBudget()">Set Budget</button>
        </div>

        <div class="card">
            <h2 class="card-title">Expenses</h2>
            <input
                type="text"
                id="expenseTitle"
                class="text-input"
                placeholder="Enter Title of Product"
            >
            <input
                type="number"
                id="expenseCost"
                class="text-input"
                placeholder="Enter Cost of Product"
                min="0"
            >
            <button type="button" class="btn-blue" onclick="addExpense()">Check Amount</button>
        </div>

    </div>

    <div class="stats-banner">
        <div class="stat-col">
            <p class="stat-label">Total Budget</p>
            <p class="stat-value" id="displayBudget">0</p>
        </div>
        <div class="stat-col">
            <p class="stat-label">Expenses</p>
            <p class="stat-value" id="displayExpenses">0</p>
        </div>
        <div class="stat-col stat-col--right">
            <p class="stat-label">Balance</p>
            <p class="stat-value" id="displayBalance">0</p>
        </div>
    </div>

    <div class="card list-card">
        <h2 class="card-title">Expense List</h2>
        <div id="expenseList"></div>
    </div>

</div>

<div class="siri-agent" id="siriAgent">
    <div class="siri-hud" id="siriHud" hidden>
        <div class="siri-wave" id="siriWave" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span>
        </div>
        <p class="siri-status" id="siriStatus"></p>
        <p class="siri-transcript" id="siriTranscript" aria-live="polite"></p>
        <p class="siri-reply" id="siriReply" hidden></p>
    </div>

    <div class="siri-orb-shell">
        <span class="siri-glow" aria-hidden="true"></span>
        <span class="siri-ring siri-ring--1" aria-hidden="true"></span>
        <span class="siri-ring siri-ring--2" aria-hidden="true"></span>
        <span class="siri-ring siri-ring--3" aria-hidden="true"></span>
        <button
            type="button"
            class="siri-orb"
            id="siriOrb"
            aria-label="Hold to speak"
        >
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
        </button>
    </div>
    <p class="siri-hint" id="siriHint">Hold to speak</p>
</div>

</body>
</html>
